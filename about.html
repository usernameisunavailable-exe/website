<!DOCTYPE html />

<html>

<head>
  <meta charset="UTF-8" />
  <meta name="author" content="robifree">
  <title>home - spudb0x.dev</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="viewport" content="width=device-width" />
  <style>
    :root {
      --bg: #181818;
      --mtext: #eeeeee;
      --stext: #cccccc;
      --ntext: #dddddd;
    }

    h1 {
      color: var(--mtext)
    }

    h2 {
      color: var(--mtext);
    }

    h6 {
      color: var(--ntext);
    }

    #node {
      margin: 0.2%;
    }


    #logo {
      display: inline-block;
      font-size: 35px;
      transition: 0.1s ease;
      text-align: left;
      letter-spacing: 0.6em;
      margin: 0.2%;
      margin-top: 0px;
      color: var(--mtext);
    }

    #logo a {
      color: var(--mtext);
      text-decoration: none;
    }

    #logo:hover {
      transform-origin: left;
      transform: scale(1.04);
    }

    .subtext {
      color: var(--stext);
    }

    body {
      background-color: var(--bg);
      font-family: "Atkinson Hyperlegible Mono Nerd Font", monospace;
      text-shadow: 0px 0px 3px rgba(204, 204, 204, 0.4);
    }

    @media (min-width: 2560px) {
      body {
        transform: scale(1.5);
        transform-origin: top center;
        margin-top: 5%;
        /* Gives it some breathing room from the top */
      }
    }
  </style>
</head>

<body>
  <p id="node" class="subtext">//node13@under my table//uptime: </p>
  <h1 id="logo"><a href="index.html">SPUDBOX</a></h1>
  <h2>about me</h2>
  <script>
    let nodenum = Math.floor(Math.random() * 70)
    let node = document.getElementById("node")

    node.textContent = ("//node" + nodenum + "@under my table//")
  </script>

</body>

</html>
